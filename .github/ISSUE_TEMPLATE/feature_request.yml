name: Feature request
description: Suggest an enhancement for MAVMRF
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What gap does this fill?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches you thought about
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits a simulation-first portfolio prototype (not live hardware ops)
          required: false
