# Dependabot version PRs disabled — MAVMRF pins deps on purpose for a stable
# clone-and-run portfolio stack. Re-enable later with coordinated upgrade testing.
#
# Security alerts can still be enabled under Settings → Code security.
version: 2
updates:
  - package-ecosystem: pip
    directory: /marmf
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
