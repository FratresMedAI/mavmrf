[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mavmrf"
version = "0.2.0"
description = "Maritime Autonomous Vehicle Monitoring and Response Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics==8.4.30",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "opencv-python==4.13.0.92",
    "numpy==2.0.2",
    "scipy==1.17.1",
    "matplotlib==3.10.6",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.11.12"]

[project.scripts]
mavmrf = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "train"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sensors*", "models*", "tracking*", "response*", "utils*", "interfaces*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
